<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPL T10 — Official Tournament Hub</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #182234;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-2: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      font-size: 1.15rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #04130d;
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 900;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
      border: none;
      font-weight: 700;
    }

    /* Hero */
    .hero {
      padding: 28px 0 18px;
      border-bottom: 1px solid var(--border);
      background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 55%);
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .hero h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .season-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .pill strong {
      color: var(--text);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 0;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .tab-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* Main Content */
    main {
      padding: 20px 0 56px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.72rem;
      text-transform: uppercase;
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
    }

    .status-live {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
    }

    .match-teams {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .score-box {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .overs {
      display: block;
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 500;
    }

    .match-foot {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--accent-2);
      font-weight: 600;
    }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--surface-2);
    }

    td.pts {
      font-weight: 800;
      color: var(--accent);
    }

    /* Gallery & Team */
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .gallery-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--surface-2);
      margin-bottom: 10px;
    }

    .empty, .loading {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav-wrap">
      <a class="brand" href="./">
        <span class="brand-badge">SPL T10</span>
        <span>SHERPUR • BOGURA</span>
      </a>
      <div class="nav-right">
        <select id="seasonSelect" aria-label="Select Season"></select>
        <a class="btn btn-primary" href="./admin.html">Admin</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-top">
        <div>
          <h1 id="heroTitle">SPL T10 Official Portal</h1>
          <p id="heroSubtitle">Fixtures, live scores, standings, squads, news & gallery</p>
        </div>
        <button class="btn" id="refreshBtn">Refresh Data</button>
      </div>
      <div class="season-meta" id="seasonMeta"></div>

      <div class="tabs" role="tablist">
        <button class="tab-btn active" data-tab="Matches">Matches</button>
        <button class="tab-btn" data-tab="PointsTable">Points Table</button>
        <button class="tab-btn" data-tab="Teams">Teams</button>
        <button class="tab-btn" data-tab="Players">Players</button>
        <button class="tab-btn" data-tab="News">News</button>
        <button class="tab-btn" data-tab="Gallery">Gallery</button>
        <button class="tab-btn" data-tab="Seasons">Seasons</button>
      </div>
    </div>
  </section>

  <main class="container">
    <div id="content" class="loading">Loading live tournament data...</div>
  </main>

  <footer>
    <div class="container">
      SPL T10 • Sherpur, Bogura • Powered by Google Sheets & GitHub Pages
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxga1GsR5689bz8PJhTp-VOXRhhS3LlQnXQs2myGCNncj0WI0MORQxqbqolSQV0bWk/exec";

    const state = {
      db: {
        Seasons: [],
        Teams: [],
        Players: [],
        Matches: [],
        PointsTable: [],
        News: [],
        Gallery: []
      },
      activeSeason: "",
      activeTab: "Matches"
    };

    const contentEl = document.getElementById("content");
    const seasonSelect = document.getElementById("seasonSelect");
    const seasonMeta = document.getElementById("seasonMeta");

    async function loadAllData() {
      contentEl.innerHTML = `<div class="loading">Syncing latest data from database...</div>`;
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || "Failed to load data");

        state.db = Object.assign(state.db, json.data || {});
        setupSeasons();
        render();
      } catch (err) {
        contentEl.innerHTML = `<div class="empty">Unable to load tournament data: ${esc(err.message)}</div>`;
      }
    }

    function setupSeasons() {
      const seasons = state.db.Seasons || [];
      if (!seasons.length) {
        seasonSelect.innerHTML = `<option value="">All Seasons</option>`;
        seasonMeta.innerHTML = `<span class="pill">No seasons added yet</span>`;
        return;
      }

      const active = seasons.find(s => String(s.Status).toLowerCase() === "active");
      if (!state.activeSeason) {
        state.activeSeason = active ? String(active.SeasonID) : String(seasons[0].SeasonID);
      }

      seasonSelect.innerHTML =
        `<option value="">All Seasons</option>` +
        seasons.map(s => `<option value="${esc(s.SeasonID)}" ${String(s.SeasonID) === state.activeSeason ? "selected" : ""}>${esc(s.SeasonName || s.SeasonID)}</option>`).join("");

      const current = seasons.find(s => String(s.SeasonID) === state.activeSeason);
      if (current) {
        seasonMeta.innerHTML = `
          <span class="pill">Status: <strong>${esc(current.Status || "N/A")}</strong></span>
          ${current.Champion ? `<span class="pill">Champion: <strong>${esc(current.Champion)}</strong></span>` : ""}
          ${current.RunnerUp ? `<span class="pill">Runner-up: <strong>${esc(current.RunnerUp)}</strong></span>` : ""}
          ${current.PlayerOfTournament ? `<span class="pill">POT: <strong>${esc(current.PlayerOfTournament)}</strong></span>` : ""}
        `;
      } else {
        seasonMeta.innerHTML = `<span class="pill">Showing records across all seasons</span>`;
      }
    }

    function filterBySeason(rows) {
      if (!state.activeSeason) return rows || [];
      const filtered = (rows || []).filter(r => String(r.SeasonID || "") === state.activeSeason);
      return filtered.length ? filtered : (rows || []);
    }

    function render() {
      const tab = state.activeTab;
      if (tab === "Matches") return renderMatches();
      if (tab === "PointsTable") return renderPointsTable();
      if (tab === "Teams") return renderTeams();
      if (tab === "Players") return renderPlayers();
      if (tab === "News") return renderNews();
      if (tab === "Gallery") return renderGallery();
      if (tab === "Seasons") return renderSeasons();
    }

    function renderMatches() {
      const rows = filterBySeason(state.db.Matches);
      if (!rows.length) return emptyState("No matches scheduled yet.");

      contentEl.innerHTML = `<div class="grid">` + rows.map(m => {
        const st = String(m.Status || "Scheduled");
        const stClass = st.toLowerCase() === "live" ? "status-live" : (st.toLowerCase() === "completed" ? "status-completed" : "");
        return `
          <article class="card">
            <div class="card-header">
              <span>Match #${esc(m.MatchNo || "-")} • ${esc(m.Date || "")} ${esc(m.Time || "")}</span>
              <span class="status-badge ${stClass}">${esc(st)}</span>
            </div>
            <div class="match-teams">
              <div class="team-row">
                <span>${esc(m.TeamA || "TBD")}</span>
                <div class="score-box">
                  <span>${esc(m.ScoreA ?? "-")}</span>
                  ${m.OversA ? `<span class="overs">(${esc(m.OversA)} ov)</span>` : ""}
                </div>
              </div>
              <div class="team-row">
                <span>${esc(m.TeamB || "TBD")}</span>
                <div class="score-box">
                  <span>${esc(m.ScoreB ?? "-")}</span>
                  ${m.OversB ? `<span class="overs">(${esc(m.OversB)} ov)</span>` : ""}
                </div>
              </div>
            </div>
            <div class="match-foot">
              ${esc(m.Result || m.Venue || "Venue TBA")}
              ${m.PlayerOfMatch ? ` • POTM: ${esc(m.PlayerOfMatch)}` : ""}
            </div>
          </article>
        `;
      }).join("") + `</div>`;
    }

    function renderPointsTable() {
      const rows = [...filterBySeason(state.db.PointsTable)].sort((a, b) => Number(b.Points || 0) - Number(a.Points || 0));
      if (!rows.length) return emptyState("Points table is not available yet.");

      contentEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>L</th>
                <th>T</th>
                <th>NR</th>
                <th>Pts</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td><strong>${esc(r.TeamName || r.ShortCode || "-")}</strong></td>
                  <td>${esc(r.Played ?? 0)}</td>
                  <td>${esc(r.Won ?? 0)}</td>
                  <td>${esc(r.Lost ?? 0)}</td>
                  <td>${esc(r.Tied ?? 0)}</td>
                  <td>${esc(r.NoResult ?? 0)}</td>
                  <td class="pts">${esc(r.Points ?? 0)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderTeams() {
      const rows = filterBySeason(state.db.Teams);
      if (!rows.length) return emptyState("No teams listed yet.");

      contentEl.innerHTML = `<div class="grid">` + rows.map(t => `
        <article class="card">
          <div class="flex-row">
            ${t.LogoURL ? `<img class="avatar" src="${esc(t.LogoURL)}" alt="${esc(t.TeamName)}" />` : `<div class="avatar"></div>`}
            <div>
              <h3>${esc(t.TeamName || "-")}</h3>
              <div class="card-header" style="margin:0">${esc(t.ShortCode || "")} ${t.Captain ? `• Captain: ${esc(t.Captain)}` : ""}</div>
            </div>
          </div>
          ${t.Overview ? `<p style="margin-top:10px;color:var(--muted);font-size:0.88rem">${esc(t.Overview)}</p>` : ""}
        </article>
      `).join("") + `</div>`;
    }

    function renderPlayers() {
      const rows = filterBySeason(state.db.Players);
      if (!rows.length) return emptyState("No players listed yet.");

      contentEl.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Player</th>
                <th>Team</th>
                <th>Role</th>
                <th>Runs</th>
                <th>Wickets</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(p => `
                <tr>
                  <td><strong>${esc(p.PlayerName || "-")}</strong> ${String(p.IsCaptain).toUpperCase() === "TRUE" || String(p.IsCaptain).toUpperCase() === "YES" ? "(C)" : ""}</td>
                  <td>${esc(p.TeamName || "-")}</td>
                  <td>${esc(p.Role || "-")}</td>
                  <td>${esc(p.Runs ?? 0)}</td>
                  <td>${esc(p.Wickets ?? 0)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderNews() {
      const rows = filterBySeason(state.db.News);
      if (!rows.length) return emptyState("No news updates published yet.");

      contentEl.innerHTML = `<div class="grid">` + rows.map(n => `
        <article class="card">
          <div class="card-header"><span>${esc(n.Date || "")}</span></div>
          <h3 style="margin-bottom:8px">${esc(n.Title || "Update")}</h3>
          <p style="color:var(--muted);font-size:0.9rem">${esc(n.Description || "")}</p>
        </article>
      `).join("") + `</div>`;
    }

    function renderGallery() {
      const rows = filterBySeason(state.db.Gallery);
      if (!rows.length) return emptyState("No photos in gallery yet.");

      contentEl.innerHTML = `<div class="grid">` + rows.map(g => `
        <article class="card">
          ${g.ImageURL ? `<img class="gallery-img" src="${esc(g.ImageURL)}" alt="${esc(g.Caption || "SPL T10 Photo")}" />` : ""}
          <p style="font-size:0.9rem;font-weight:600">${esc(g.Caption || "")}</p>
          ${g.Date ? `<span class="card-header" style="margin-top:6px;margin-bottom:0">${esc(g.Date)}</span>` : ""}
        </article>
      `).join("") + `</div>`;
    }

    function renderSeasons() {
      const rows = state.db.Seasons || [];
      if (!rows.length) return emptyState("No seasons found.");

      contentEl.innerHTML = `<div class="grid">` + rows.map(s => `
        <article class="card">
          <div class="card-header">
            <span>${esc(s.SeasonID || "")}</span>
            <span class="status-badge">${esc(s.Status || "")}</span>
          </div>
          <h3 style="margin-bottom:8px">${esc(s.SeasonName || "")}</h3>
          <p style="color:var(--muted);font-size:0.88rem">
            ${s.Champion ? `Champion: <strong>${esc(s.Champion)}</strong><br>` : ""}
            ${s.RunnerUp ? `Runner-up: <strong>${esc(s.RunnerUp)}</strong><br>` : ""}
            ${s.PlayerOfTournament ? `Player of Tournament: <strong>${esc(s.PlayerOfTournament)}</strong><br>` : ""}
            ${s.Summary ? `<span style="display:block;margin-top:6px">${esc(s.Summary)}</span>` : ""}
          </p>
        </article>
      `).join("") + `</div>`;
    }

    function emptyState(msg) {
      return `<div class="empty">${esc(msg)}</div>`;
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.activeTab = btn.dataset.tab;
        render();
      });
    });

    seasonSelect.addEventListener("change", (e) => {
      state.activeSeason = e.target.value;
      setupSeasons();
      render();
    });

    document.getElementById("refreshBtn").addEventListener("click", loadAllData);

    loadAllData();
  </script>
</body>
  </html>
